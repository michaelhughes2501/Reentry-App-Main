services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reentry-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: local-reentry-development-secret
      DB_PATH: /app/data/reentry.db
    volumes:
      - reentry_data:/app/data
    restart: unless-stopped
volumes:
  reentry_data:
