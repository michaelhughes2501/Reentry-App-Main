name: CI

# Real verification on every PR. This project is plain ESM JavaScript with no
# TypeScript and no build step, so the gate is: does every source file parse,
# and does the node:test suite pass.
#
# Uses `npm install` rather than `npm ci`: this repo has no committed
# package-lock.json (npm workspace member locally, standalone repo on GitHub).
#
# The `verify` job is the one to mark as a required status check.
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      # NODE_ENV=production makes npm set omit=dev, silently skipping
      # devDependencies while still exiting 0. It also matters here because
      # better-sqlite3 is a native dependency.
      NODE_ENV: development
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --include=dev

      # Cheap parse gate: catches syntax errors even in files no test imports.
      - name: Syntax check all source files
        run: |
          find . -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 -r -n1 node --check

      - name: Test
        run: npm test
